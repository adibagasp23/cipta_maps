name: cipta_maps
description: >-
  Map picker widget (flutter_map + MapTiler) untuk memilih lokasi (latitude/
  longitude) dengan marker draggable. Reusable untuk semua aplikasi Cipta.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  cipta_debug_badges:
    git:
      url: https://github.com/adibagasp23/cipta_debug_badges.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0